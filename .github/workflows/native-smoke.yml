name: Native Opt4D smoke tests

on:
  push:
    branches:
      - 'research/**'
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install numpy
      - name: Test native prepare and frozen-case logic
        run: python -m unittest discover -s tests -v
      - name: Test toy parameter optimization
        run: python scripts/toy_optimize.py
